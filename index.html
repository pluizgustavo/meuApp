<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

<ion-input v-model="novaTarefa" placeholder="Nova tarefa"></ion-input>
<ion-button @click="adicionarNova">Adicionar</ion-button>

<ion-input v-model="busca" placeholder="Buscar tarefa"></ion-input>

<ion-segment v-model="filtroAtivo">
  <ion-segment-button value="todas">Todas</ion-segment-button>
  <ion-segment-button value="pendentes">Pendentes</ion-segment-button>
  <ion-segment-button value="feitas">Feitas</ion-segment-button>
</ion-segment>

<p>Pendentes: {{ totalPendentes }}</p>

<CardTarefa
  v-for="t in filtradas"
  :key="t.id"
  :tarefa="t"
  @remover="remover"
  @concluir="concluir"

/>
  </body>

</html>
